name: iOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen

      - name: Build (unsigned)
        run: |
          xcodebuild -project ExeRunner.xcodeproj -scheme ExeRunner \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/ExeRunner.app
          # Embed the entitlements so sideloading tools can carry them over.
          ldid -SExeRunner/ExeRunner.entitlements "$APP/ExeRunner"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ExeRunner.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ExeRunner-ipa
          path: ExeRunner.ipa
